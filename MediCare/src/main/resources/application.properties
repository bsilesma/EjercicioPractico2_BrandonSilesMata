spring.application.name=MediCare

# Puerto para iniciar
server.port=78

# Conexion a la base de datos medicare de MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/medicare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate 
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.thymeleaf.cache=false

# Spring Mail sobre el SMTP de Gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username= silesmatab@gmail.com
spring.mail.password= Esta vara la pongo después
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Roles')}"></head>
<body>

<nav th:replace="~{fragmentos/base :: navegacion}"></nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gestion de roles</h1>
        <a class="btn btn-primary" th:href="@{/roles/nuevo}">Nuevo rol</a>
    </div>

    <div th:replace="~{fragmentos/base :: avisos}"></div>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Nombre</th>
            <th scope="col" class="text-end">Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rolDeLaFila : ${listaRoles}">
            <td th:text="${rolDeLaFila.id}">1</td>
            <td th:text="${rolDeLaFila.nombre}">ADMIN</td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary"
                   th:href="@{/roles/editar/{id}(id=${rolDeLaFila.id})}">Editar</a>
                <a class="btn btn-sm btn-outline-danger"
                   th:href="@{/roles/eliminar/{id}(id=${rolDeLaFila.id})}"
                   onclick="return confirm('Desea eliminar este rol?');">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(listaRoles)}">
            <td colspan="3" class="text-center text-body-secondary">No hay roles registrados.</td>
        </tr>
        </tbody>
    </table>
</main>

<footer th:replace="~{fragmentos/base :: pie}"></footer>
<div th:replace="~{fragmentos/base :: scripts}"></div>

</body>
</html>

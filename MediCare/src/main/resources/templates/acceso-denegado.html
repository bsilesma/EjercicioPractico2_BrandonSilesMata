<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Acceso denegado')}"></head>
<body>

<nav th:replace="~{fragmentos/base :: navegacion}"></nav>

<main class="container my-5">
    <div class="alert alert-danger" role="alert">
        <h1 class="h5">Acceso denegado</h1>
        <p class="mb-0">
            Su rol
            <span th:if="${rolEnSesion != null}" th:text="'(' + ${rolEnSesion} + ')'"></span>
            no tiene permiso para ingresar a esta seccion del sistema.
        </p>
    </div>
    <a class="btn btn-secondary" th:href="@{/}">Volver al inicio</a>
</main>

<footer th:replace="~{fragmentos/base :: pie}"></footer>
<div th:replace="~{fragmentos/base :: scripts}"></div>

</body>
</html>

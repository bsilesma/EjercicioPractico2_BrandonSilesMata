<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Cabecera comun: recibe el titulo de cada pagina y carga los estilos de Bootstrap. -->
<head th:fragment="cabecera(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'MediCare | ' + ${titulo}">MediCare</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<!-- Barra de navegacion compartida por todas las paginas. -->
<nav th:fragment="navegacion" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">MediCare</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <!-- Cada opcion se muestra solo si el rol de la sesion tiene permiso sobre ese modulo. -->
            <ul class="navbar-nav me-auto">
                <li class="nav-item" th:if="${rolEnSesion == 'ADMIN'}">
                    <a class="nav-link" th:href="@{/usuarios}">Usuarios</a>
                </li>
                <li class="nav-item" th:if="${rolEnSesion == 'ADMIN'}">
                    <a class="nav-link" th:href="@{/roles}">Roles</a>
                </li>
                <li class="nav-item" th:if="${rolEnSesion != null}">
                    <a class="nav-link" th:href="@{/citas}">Citas medicas</a>
                </li>
                <li class="nav-item" th:if="${rolEnSesion != null}">
                    <a class="nav-link" th:href="@{/consultas}">Consultas</a>
                </li>
            </ul>

            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item" th:if="${rolEnSesion != null}">
                    <span class="navbar-text me-3"
                          th:text="${correoEnSesion} + ' (' + ${rolEnSesion} + ')'">correo (ROL)</span>
                </li>
                <li class="nav-item" th:if="${rolEnSesion != null}">
                    <form th:action="@{/logout}" method="post">
                        <button class="btn btn-sm btn-outline-light" type="submit">Cerrar sesion</button>
                    </form>
                </li>
                <li class="nav-item" th:if="${rolEnSesion == null}">
                    <a class="nav-link" th:href="@{/login}">Iniciar sesion</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Avisos de exito o error que envian los controladores. -->
<div th:fragment="avisos">
    <div class="alert alert-success" role="alert" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>
    <div class="alert alert-danger" role="alert" th:if="${mensajeError}" th:text="${mensajeError}"></div>
</div>

<footer th:fragment="pie" class="border-top mt-5 py-3">
    <div class="container text-center text-body-secondary small">
        MediCare, su peor opcion
    </div>
</footer>

<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Usuarios')}"></head>
<body>

<nav th:replace="~{fragmentos/base :: navegacion}"></nav>

<main class="container my-4">
    <h1 class="h3 mb-3" th:text="${usuario.id} == null ? 'Nuevo usuario' : 'Editar usuario'">Nuevo usuario</h1>

    <div th:replace="~{fragmentos/base :: avisos}"></div>

    <div class="row">
        <div class="col-md-7">
            <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label class="form-label" for="nombre">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}"
                           maxlength="150" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Correo electronico</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}"
                           maxlength="200" required>
                    <div class="form-text">A esta direccion se envia el correo de bienvenida.</div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Contrasena</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}"
                           th:required="${usuario.id} == null">
                    <div class="form-text" th:if="${usuario.id} != null">
                        Dejela en blanco para conservar la contrasena actual.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="rol">Rol asignado</label>
                    <select class="form-select" id="rol" name="rol" required>
                        <option value="">Seleccione un rol</option>
                        <option th:each="rolDisponible : ${listaRoles}"
                                th:value="${rolDisponible.id}"
                                th:text="${rolDisponible.nombre}"
                                th:selected="${usuario.rol != null and usuario.rol.id == rolDisponible.id}">ADMIN</option>
                    </select>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input" id="activo" th:field="*{activo}">
                    <label class="form-check-label" for="activo">Usuario activo</label>
                </div>

                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/usuarios}">Cancelar</a>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: pie}"></footer>
<div th:replace="~{fragmentos/base :: scripts}"></div>

</body>
</html>

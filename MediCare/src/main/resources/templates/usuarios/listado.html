<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Usuarios')}"></head>
<body>

<nav th:replace="~{fragmentos/base :: navegacion}"></nav>

<main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Gestion de usuarios</h1>
        <a class="btn btn-primary" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <div th:replace="~{fragmentos/base :: avisos}"></div>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nombre</th>
                <th scope="col">Correo</th>
                <th scope="col">Rol</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-end">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="usuarioDeLaFila : ${listaUsuarios}">
                <td th:text="${usuarioDeLaFila.id}">1</td>
                <td th:text="${usuarioDeLaFila.nombre}">Nombre</td>
                <td th:text="${usuarioDeLaFila.email}">correo@medicare.com</td>
                <td th:text="${usuarioDeLaFila.rol != null} ? ${usuarioDeLaFila.rol.nombre} : 'Sin rol'">ADMIN</td>
                <td>
                    <span class="badge text-bg-success" th:if="${usuarioDeLaFila.activo}">Activo</span>
                    <span class="badge text-bg-secondary" th:unless="${usuarioDeLaFila.activo}">Inactivo</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-primary"
                       th:href="@{/usuarios/detalle/{id}(id=${usuarioDeLaFila.id})}">Detalle</a>
                    <a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/usuarios/editar/{id}(id=${usuarioDeLaFila.id})}">Editar</a>
                    <a class="btn btn-sm btn-outline-danger"
                       th:href="@{/usuarios/eliminar/{id}(id=${usuarioDeLaFila.id})}"
                       onclick="return confirm('Desea eliminar este usuario?');">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(listaUsuarios)}">
                <td colspan="6" class="text-center text-body-secondary">No hay usuarios registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: pie}"></footer>
<div th:replace="~{fragmentos/base :: scripts}"></div>

</body>
</html>

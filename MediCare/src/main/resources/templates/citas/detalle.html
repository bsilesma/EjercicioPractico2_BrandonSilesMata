<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/base :: cabecera('Citas medicas')}"></head>
<body>

<nav th:replace="~{fragmentos/base :: navegacion}"></nav>

<main class="container my-4">
    <h1 class="h3 mb-3">Detalle de la cita medica</h1>

    <div class="card">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Codigo</dt>
                <dd class="col-sm-9" th:text="${cita.id}">1</dd>

                <dt class="col-sm-3">Paciente</dt>
                <dd class="col-sm-9" th:text="${cita.pacienteNombre}">Paciente</dd>

                <dt class="col-sm-3">Especialidad</dt>
                <dd class="col-sm-9" th:text="${cita.especialidad}">Especialidad</dd>

                <dt class="col-sm-3">Fecha</dt>
                <dd class="col-sm-9"
                    th:text="${cita.fecha != null} ? ${#temporals.format(cita.fecha, 'dd/MM/yyyy')} : '-'">01/01/2026</dd>

                <dt class="col-sm-3">Costo</dt>
                <dd class="col-sm-9"
                    th:text="${cita.costo != null} ? ${#numbers.formatDecimal(cita.costo, 1, 'COMMA', 2, 'POINT')} : '-'">0.00</dd>

                <dt class="col-sm-3">Estado</dt>
                <dd class="col-sm-9" th:text="${cita.activa} ? 'Activa' : 'Inactiva'">Activa</dd>
            </dl>
        </div>
    </div>

    <div class="mt-3">
        <a class="btn btn-secondary" th:href="@{/citas}">Volver al listado</a>
        <a class="btn btn-primary" th:if="${rolEnSesion != 'PACIENTE'}"
           th:href="@{/citas/editar/{id}(id=${cita.id})}">Editar</a>
    </div>
</main>

<footer th:replace="~{fragmentos/base :: pie}"></footer>
<div th:replace="~{fragmentos/base :: scripts}"></div>

</body>
</html>
